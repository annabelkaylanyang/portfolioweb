    <button class="mode-toggle" id="modeToggle" aria-label="Toggle color mode">

  <!-- ══════════════════════════════════════════
       PLAY GALLERY  —  parallax columns
       ---------------------------------------------
       Each .parallax-col scrolls vertically at its own
       speed (depth). js/main.js duplicates each column's
       cards so it can loop seamlessly, staggers the
       starting offsets, and makes whichever column the
       cursor is over the fastest one.

       ONE CARD PER COLLECTION. A collection (data-group)
       shows only its cover here — the FIRST entry in its
       array in #playGroups below. The rest of the set is
       reached by opening the cover and using the arrows,
       so don't add sibling cards for the same group.

       To change a collection's cover, move that path to
       the front of its array AND point this card at it.

       data-view="book" binds that collection into a zine
       instead of arrow-stepped slides: two pages to a
       spread, turned a leaf at a time. The cover (the
       first entry) stays a cover — the book is made from
       the interior pages that follow it.

       Standalone pieces (no data-group) just sit here as
       their own card. Aspect-ratio classes:
         .ar-sq 1:1  .ar-tall 2:3  .ar-port 3:4
         .ar-wide 4:3  .ar-land 16:9
       ══════════════════════════════════════════ -->
  <main class="parallax" id="parallax" aria-label="Play gallery">

    <!-- Column 1 (slow / far) -->
    <div class="parallax-col" data-speed="0.55">
      <div class="parallax-col-track">
        <div class="gallery-card" data-group="suntrace"><img src="images/play/suntrace/suntrace1.png" alt="Suntrace" /></div>
        <div class="gallery-card" data-group="splash"><img src="images/play/splash/splashstudy.png" alt="Splash studies" /></div>
        <div class="gallery-card"><img src="images/play/coffeeposter.png" alt="Coffee poster" /></div>
        <div class="gallery-card"><img src="images/play/cinema.gif" alt="Cinema" /></div>
        <div class="gallery-card is-framed" data-group="balloonman"><img src="images/balloonman/balloon1.png" alt="Balloon Man" /></div>
      </div>
    </div>

    <!-- Column 2 (medium) -->
    <div class="parallax-col" data-speed="0.8">
      <div class="parallax-col-track">
        <div class="gallery-card" data-group="nostalgia" data-view="book"><img src="images/play/nostalgia/nostalgiacover.jpg" alt="Nostalgia" /></div>
        <div class="gallery-card" data-group="machine"><img src="images/play/machine/machine1.png" alt="Machine" /></div>
        <div class="gallery-card is-framed"><img src="images/play/rainchain.png" alt="Rain chain" /></div>
        <div class="gallery-card is-framed"><img src="images/play/spring-show-poster/springshowposter.png" alt="Spring show poster" /></div>
        <div class="gallery-card" data-group="city">
          <video src="images/play/city/city3.mp4" autoplay muted loop playsinline preload="metadata"
                 aria-label="City"></video>
        </div>
      </div>
    </div>

    <!-- Column 3 (near / fast) -->
    <div class="parallax-col" data-speed="1.05">
      <div class="parallax-col-track">
        <div class="gallery-card" data-group="environment"><img src="images/play/environment/sketchstudy.png" alt="Environment studies" /></div>
        <div class="gallery-card"><img src="images/play/fallenangels.png" alt="Fallen angels" /></div>
        <div class="gallery-card"><img src="images/play/selfportrait.gif" alt="Self portrait" /></div>
        <div class="gallery-card"><img src="images/play/study.png" alt="Study" /></div>
      </div>
    </div>

  </main>


  <!-- ══════════════════════════════════════════
       LIGHTBOX  —  click any card to enlarge
       ---------------------------------------------
       Cards tagged with data-group open as a set the
       arrows cycle through (wrapping forever in both
       directions). Cards with no data-group open on
       their own, with the arrows hidden.

       The sets below are the SOURCE OF TRUTH for what
       the arrows step through — they deliberately
       include related pieces that aren't shown as
       cards in the columns (e.g. suntrace4). To add
       one, drop its path into the right array; to add
       a new set, add a key here and put data-group
       with that key on the card.
       ══════════════════════════════════════════ -->
  <script type="application/json" id="playGroups">
  {
    "suntrace": [
      "images/play/suntrace/suntrace1.png",
      "images/play/suntrace/suntrace2.png",
      "images/play/suntrace/suntrace3.png",
      "images/play/suntrace/suntrace4.png",
      "images/play/suntrace/suntrace5.png",
      "images/play/suntrace/suntrace6.png",
      "images/play/suntrace/suntrace7.png"
    ],
    "machine": [
      "images/play/machine/machine1.png",
      "images/play/machine/machine2.png",
      "images/play/machine/machine3.png"
    ],
    "nostalgia": [
      "images/play/nostalgia/nostalgiacover.jpg",
      "images/play/nostalgia/nostalgia4.png",
      "images/play/nostalgia/nostalgia5.png",
      "images/play/nostalgia/nostalgia.png",
      "images/play/nostalgia/nostalgia1.png",
      "images/play/nostalgia/nostalgia2.png",
      "images/play/nostalgia/nostalgia3.png"
    ],
    "environment": [
      "images/play/environment/sketchstudy.png",
      "images/play/environment/environment1.png",
      "images/play/environment/environment2.png"
    ],
    "splash": [
      "images/play/splash/splashstudy.png",
      "images/play/splash/splash-study2.png",
      "images/play/splash/akalisplash.png",
      "images/play/splash/dianasplash.png",
      "images/play/splash/hweisplash.png",
      "images/play/splash/luxsplash.png"
    ],
    "balloonman": [
      "images/balloonman/balloon1.png",
      "images/balloonman/balloon2.png"
    ],
    "city": [
      "images/play/city/city3.mp4"
    ]
  }
  </script>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Gallery viewer">
    <button class="lightbox__close" data-role="close" type="button" aria-label="Close viewer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" /></svg>
    </button>

    <button class="lightbox__nav lightbox__nav--prev" data-role="prev" type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4L7 12l8 8" /></svg>
    </button>

    <figure class="lightbox__stage" data-role="stage"></figure>

    <button class="lightbox__nav lightbox__nav--next" data-role="next" type="button" aria-label="Next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" /></svg>
    </button>

    <p class="lightbox__counter" data-role="counter" aria-live="polite"></p>
  </div>
